name: Worker tests

on:
  pull_request:
    branches:
      - main
      - feature/reviews-moderation
      - feature/admin-edit-before-publish
  push:
    branches:
      - main
      - feature/reviews-moderation
      - feature/admin-edit-before-publish
      - fix/review-album-and-inline-edit

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check worker.js
      - name: Run Worker regression tests
        run: node --test worker.test.mjs
