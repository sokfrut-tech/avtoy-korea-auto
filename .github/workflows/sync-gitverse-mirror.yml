name: Sync Russian GitVerse Mirror

on:
  repository_dispatch:
    types: [catalog-updated]
  workflow_run:
    workflows: ["Deploy AVTOY KOREA Worker"]
    types: [completed]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: gitverse-mirror-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify GitVerse secret is configured
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
        run: |
          if [ -z "$GITVERSE_TOKEN" ]; then
            echo "::error::Missing GitHub secret GITVERSE_TOKEN"
            exit 1
          fi

      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clone existing GitVerse mirror for incremental sync
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          CLEAN_TOKEN="$(printf '%s' "$GITVERSE_TOKEN" | tr -d '\r\n')"
          AUTH_HEADER="Authorization: Basic $(printf 'opus_pampus:%s' "$CLEAN_TOKEN" | base64 | tr -d '\r\n')"
          REPO_URL="https://gitverse.ru/avtoy-korea/avtoy-korea.git"
          HAS_MAIN="$(git -c credential.helper= -c "http.https://gitverse.ru/.extraheader=$AUTH_HEADER" ls-remote --heads "$REPO_URL" main | wc -l | tr -d ' ')"
          for attempt in 1 2 3; do
            rm -rf standby/public
            if [ "$HAS_MAIN" != "0" ]; then
              if git -c credential.helper= -c "http.https://gitverse.ru/.extraheader=$AUTH_HEADER" clone --depth 1 --branch main "$REPO_URL" standby/public; then
                break
              fi
            else
              if git -c credential.helper= -c "http.https://gitverse.ru/.extraheader=$AUTH_HEADER" clone --depth 1 "$REPO_URL" standby/public; then
                git -C standby/public checkout -B main
                break
              fi
            fi
            echo "Clone attempt $attempt failed, retrying in 5s..."
            sleep 5
          done
          test -d standby/public/.git

      - name: Rebuild static showcase and SEO bundle from Cloudflare Worker
        run: node standby/scripts/migrate-to-ru.mjs

      - name: Push incremental updates to GitVerse Pages
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          GITVERSE_USER: opus_pampus
        run: node standby/scripts/push-gitverse.mjs
