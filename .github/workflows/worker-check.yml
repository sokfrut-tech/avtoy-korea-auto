name: Cloudflare Worker checks

on:
  push:
    branches: [main, feature/reviews-moderation]
    paths:
      - "worker.js"
      - "worker.test.mjs"
      - ".github/workflows/worker-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "worker.js"
      - "worker.test.mjs"
      - ".github/workflows/worker-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Check Worker syntax
        run: node --input-type=module --check < worker.js
      - name: Test private admin routing
        run: node --experimental-default-type=module --test worker.test.mjs
