name: Standby independent validation
# Revalidate after configuring the private GitLab read token.

on:
  push:
    branches:
      - deploy/russian-static-mirror-2026-11-15
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standby-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ''

      - name: Fetch the pinned private GitLab source commit
        env:
          GITLAB_READ_TOKEN: ${{ secrets.GITLAB_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GITLAB_READ_TOKEN:-}" ]; then
            echo "::error::Missing GITLAB_READ_TOKEN. Add a GitLab personal access token with read_repository scope as a GitHub Actions secret."
            exit 1
          fi
          AUTH="$(printf 'oauth2:%s' "$GITLAB_READ_TOKEN" | base64 -w0)"
          mkdir -p "$RUNNER_TEMP/avtoy-korea-auto"
          cd "$RUNNER_TEMP/avtoy-korea-auto"
          git init
          git remote add origin https://gitlab.com/sokfrut/avtoy-korea-auto.git
          git -c "http.extraheader=Authorization: Basic $AUTH" fetch --depth 1 origin 2fe182560e35175bb1438fded60bcc1d5a74ff91
          git checkout --detach FETCH_HEAD
          unset AUTH GITLAB_READ_TOKEN
          test "$(git rev-parse HEAD)" = "2fe182560e35175bb1438fded60bcc1d5a74ff91"
          test -f standby/package.json

      - name: Install standby dependencies
        working-directory: ${{ runner.temp }}/avtoy-korea-auto/standby
        run: npm install --no-audit --no-fund

      - name: Run complete regression suite
        working-directory: ${{ runner.temp }}/avtoy-korea-auto/standby
        run: npm test

      - name: Run syntax and source checks
        working-directory: ${{ runner.temp }}/avtoy-korea-auto/standby
        run: npm run check
