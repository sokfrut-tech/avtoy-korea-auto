name: Standby independent validation

on:
  push:
    branches:
      - deploy/russian-static-mirror-2026-11-15
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standby-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ''

      - name: Fetch the exact private GitLab research branch
        env:
          GITLAB_READ_TOKEN: ${{ secrets.GITLAB_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GITLAB_READ_TOKEN:-}" ]; then
            echo "::error::Missing GITLAB_READ_TOKEN. Add a read_repository-only GitLab token as a GitHub Actions secret."
            exit 1
          fi
          AUTH="$(printf 'oauth2:%s' "$GITLAB_READ_TOKEN" | base64 -w0)"
          git -c "http.extraheader=Authorization: Basic $AUTH" clone --depth 1 --branch research/russia-migration-assessment-2026-11-14 https://gitlab.com/sokfrut/avtoy-korea-auto.git "$RUNNER_TEMP/avtoy-korea-auto"
          unset AUTH GITLAB_READ_TOKEN
          test -f "$RUNNER_TEMP/avtoy-korea-auto/standby/package.json"

      - name: Install standby dependencies
        working-directory: ${{ runner.temp }}/avtoy-korea-auto/standby
        run: npm install --no-audit --no-fund

      - name: Run complete regression suite
        working-directory: ${{ runner.temp }}/avtoy-korea-auto/standby
        run: npm test

      - name: Run syntax and source checks
        working-directory: ${{ runner.temp }}/avtoy-korea-auto/standby
        run: npm run check
