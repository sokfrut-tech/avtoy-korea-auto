name: Deploy AVTOY KOREA Worker

on:
  push:
    branches: [main]
    paths:
      - "worker.js"
      - "assets-src/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore binary assets and verify SHA-256
        run: |
          node << 'EOF'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');

          fs.mkdirSync('public/assets', { recursive: true });
          const dir = 'assets-src';
          const allFiles = fs.existsSync(dir) ? fs.readdirSync(dir).sort() : [];

          function readAssetB64(matchers) {
            const matched = allFiles.filter(f => matchers.some(m => f.startsWith(m)));
            if (matched.length === 0) {
              throw new Error(`No source files in ${dir} matching: ${matchers.join(', ')}`);
            }
            return matched.map(f => fs.readFileSync(path.join(dir, f), 'utf8')).join('').replace(/\\s+/g, '');
          }

          const targets = [
            {
              matchers: ['logo'],
              dest: 'public/assets/logo.jpg',
              expectedSize: 18979,
              expectedSha256: '2aa1fa2840857b09eff4a78b63935abeaaa692bef4801f87ce37b972d01fc453'
            },
            {
              matchers: ['kia-sportage', 'sportage'],
              dest: 'public/assets/kia-sportage.jpg',
              expectedSize: 16326,
              expectedSha256: 'd3bb08643743f759b1aedf87456fb7cae8dff550db285814d94cdc924459ee92'
            }
          ];

          for (const t of targets) {
            const b64 = readAssetB64(t.matchers);
            const buf = Buffer.from(b64, 'base64');
            const actualSha256 = crypto.createHash('sha256').update(buf).digest('hex');
            console.log(`${t.dest}: ${buf.length} bytes, SHA-256: ${actualSha256}`);
            if (buf.length !== t.expectedSize) throw new Error(`Size mismatch for ${t.dest}: expected ${t.expectedSize}, got ${buf.length}`);
            if (actualSha256 !== t.expectedSha256) throw new Error(`SHA-256 mismatch for ${t.dest}: expected ${t.expectedSha256}, got ${actualSha256}`);
            fs.writeFileSync(t.dest, buf);
          }
          EOF

      - name: Check Worker syntax
        run: node --input-type=module --check < worker.js

      - name: Run Worker regression tests
        run: node --test worker.test.mjs

      - name: Verify Cloudflare deployment secrets
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_ACCOUNT_ID. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Cloudflare deployment secrets are present."

      - name: Deploy website Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
