name: MAX command outbox validation

on:
  pull_request:
    branches:
      - feature/max-operator-commands-2026-11-16
  push:
    branches:
      - feature/max-command-reply-outbox-implementation-2026-11-16

permissions:
  contents: read

concurrency:
  group: max-command-outbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check changed runtime and test modules
        run: |
          set -euo pipefail
          node --check standby/server.mjs
          node --check standby/storage/ydb-request-store.mjs
          node --check standby/storage/max-command-outbox.test.mjs
          node --check standby/test/server.test.mjs
      - name: Run standby regression tests
        run: |
          set -euo pipefail
          node --test standby/channels/*.test.mjs standby/security/*.test.mjs standby/storage/*.test.mjs standby/test/*.test.mjs
