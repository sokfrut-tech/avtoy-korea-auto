name: GitLab backup sync

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitlab-backup-sync
  cancel-in-progress: false

jobs:
  sync-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check backup credential
        id: credential
        env:
          GITLAB_MIRROR_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$GITLAB_MIRROR_TOKEN" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitLab backup is not configured yet. Add the GITLAB_MIRROR_TOKEN repository secret."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push main and tags to GitLab backup
        if: steps.credential.outputs.available == 'true'
        env:
          GITLAB_MIRROR_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git remote add gitlab "https://oauth2:${GITLAB_MIRROR_TOKEN}@gitlab.com/sokfrut/avtoy-korea-auto.git"
          git push gitlab HEAD:refs/heads/main
          git push gitlab --tags
