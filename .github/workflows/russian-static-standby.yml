name: Publish Russian static standby

on:
  push:
    branches:
      - deploy/russian-static-mirror-2026-11-15
    paths:
      - '.github/workflows/russian-static-standby.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: russian-static-standby
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GITLAB_SOURCE_SHA: 2fe182560e35175bb1438fded60bcc1d5a74ff91
      PAGES_PROJECT: avtoy-korea-russian-standby
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch exact reviewed GitLab source
        env:
          GITLAB_READ_TOKEN: ${{ secrets.GITLAB_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GITLAB_READ_TOKEN:-}" ]; then
            echo "::error::Missing GITLAB_READ_TOKEN. Add a GitLab token with read_repository scope to GitHub Actions secrets."
            exit 1
          fi
          AUTH="$(printf 'oauth2:%s' "$GITLAB_READ_TOKEN" | base64 -w0)"
          mkdir -p "$RUNNER_TEMP/avtoy-korea-source"
          cd "$RUNNER_TEMP/avtoy-korea-source"
          git init
          git remote add origin https://gitlab.com/sokfrut/avtoy-korea-auto.git
          git -c "http.extraheader=Authorization: Basic $AUTH" fetch --depth 1 origin "$GITLAB_SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          unset AUTH GITLAB_READ_TOKEN
          test "$(git rev-parse HEAD)" = "$GITLAB_SOURCE_SHA"
          test -f standby/package.json
          echo "SOURCE_DIR=$RUNNER_TEMP/avtoy-korea-source/standby" >> "$GITHUB_ENV"

      - name: Install dependencies and run complete regression suite
        working-directory: ${{ runner.temp }}/avtoy-korea-source/standby
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run check

      # Never build the archive from the public Worker API: source KV is the
      # authority for approved records, and Telegram files are mirrored locally.
      - name: Export only approved Cloudflare KV records (private workspace)
        working-directory: ${{ runner.temp }}/avtoy-korea-source/standby
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: 302a622dc2514025b2118c8f3216beac
        run: node scripts/export-approved-kv.mjs data/private-approved-export.json --confirm-approved-public-export

      - name: Inventory approved Telegram media (private report)
        working-directory: ${{ runner.temp }}/avtoy-korea-source/standby
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          node scripts/inventory-approved-media.mjs data/private-approved-export.json data/private-media-inventory.json
          node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync('data/private-media-inventory.json','utf8')); const t=r.totals; if(t.incompleteRecords || t.lookupFailures || t.filesOverDownloadLimit) throw new Error('Approved media inventory is incomplete; refusing publication');"

      - name: Mirror approved Telegram media locally
        working-directory: ${{ runner.temp }}/avtoy-korea-source/standby
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: node scripts/mirror-approved-media.mjs data/private-approved-export.json data/media-map.json public/media

      - name: Build sanitized public snapshot and verify exact source parity
        working-directory: ${{ runner.temp }}/avtoy-korea-source/standby
        run: |
          node scripts/build-public-snapshot.mjs data/private-approved-export.json data/public-snapshot.json data/media-map.json
          node scripts/verify-public-parity.mjs data/private-approved-export.json data/public-snapshot.json data/media-map.json
          node scripts/create-public-manifest.mjs data/public-snapshot.json public/media data/public-manifest.json

      - name: Build static catalogue
        working-directory: ${{ runner.temp }}/avtoy-korea-source/standby
        run: node scripts/build-static-catalog.mjs data/public-snapshot.json public/media pages

      - name: Verify static output has no runtime origin dependency
        working-directory: ${{ runner.temp }}/avtoy-korea-source/standby
        run: node scripts/verify-static-origin.mjs pages

      - name: Verify Cloudflare Pages credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Create Pages project if missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          STATUS=$(curl -sS -o "$RUNNER_TEMP/pages-project.json" -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT")
          if [ "$STATUS" = "404" ]; then
            curl -fsS -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"name\":\"$PAGES_PROJECT\",\"production_branch\":\"main\"}" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          elif [ "$STATUS" != "200" ]; then
            cat "$RUNNER_TEMP/pages-project.json"
            exit 1
          fi

      - name: Deploy verified static mirror
        working-directory: ${{ runner.temp }}/avtoy-korea-source/standby
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler pages deploy pages --project-name "$PAGES_PROJECT" --branch main
