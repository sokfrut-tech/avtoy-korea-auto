name: AVTOY Korea — Factory Review

on:
  pull_request:
    branches: [main]
    paths:
      - 'worker.js'
      - 'worker.test.mjs'
      - 'README.md'
      - 'AGENTS.md'
      - 'docs/**'
      - '.github/workflows/**'
  push:
    branches: [feature/numbered-private-order-workflow]
    paths:
      - 'worker.js'
      - 'worker.test.mjs'
      - 'README.md'
      - 'AGENTS.md'
      - 'docs/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avtoy-factory-${{ github.ref }}
  cancel-in-progress: false

jobs:
  functional:
    name: Functional / regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check worker.js
      - name: Full test suite
        run: node --test worker.test.mjs

  security:
    name: Security / privacy regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify private delivery, admin-only actions and review media boundaries
        run: >-
          node --test
          --test-name-pattern='private client messages|group messages are ignored|only an admin can request private order details|order details are never sent to a group|callbacks from non-admins|admin import buttons are rejected outside the admin private chat|configured group media sent by an admin|admin can upload review photo directly|group media notification retries|review import keeps staged media|private admin upload retries moderation card|non-admin private media upload'
          worker.test.mjs

  director:
    name: Director / release evidence
    needs: [functional, security]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write factory handoff
        env:
          TEST_RESULT: ${{ needs.functional.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          mkdir -p build/factory
          cat > build/factory/AVTOY_HANDOFF.md <<EOF
          # AVTOY Korea factory handoff
          - commit: ${GITHUB_SHA}
          - functional_tests: ${TEST_RESULT}
          - security_review: ${SECURITY_RESULT}
          - scope: Cloudflare Worker, Telegram webhook, private order delivery, review moderation
          - production_deploy: NOT AUTHORIZED BY THIS WORKFLOW
          - release_rule: passing CI is not proof of live Telegram or website operation
          EOF
      - name: Publish factory handoff in job summary
        if: always()
        run: |
          if [ -f build/factory/AVTOY_HANDOFF.md ]; then
            cat build/factory/AVTOY_HANDOFF.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Factory handoff file was not created; inspect the functional/security jobs above." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Archive factory handoff
        id: archive_handoff
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: avtoy-factory-handoff
          path: build/factory/AVTOY_HANDOFF.md
      - name: Record artifact storage fallback
        if: steps.archive_handoff.outcome == 'failure'
        run: echo "The handoff is preserved in this job summary; GitHub artifact storage is currently unavailable or over quota." >> "$GITHUB_STEP_SUMMARY"
