name: Standby independent CI

on:
  push:
    branches:
      - "ci/standby-independent-runner-*"
    paths:
      - "standby/**"
      - ".github/workflows/standby-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "standby/**"
      - ".github/workflows/standby-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standby-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standby-node-tests:
    name: Standby syntax and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch revision
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: standby/package.json
      - name: Install dependencies
        working-directory: standby
        run: npm install --no-audit --no-fund
      - name: Syntax checks
        working-directory: standby
        run: npm run check
      - name: Regression tests
        working-directory: standby
        run: npm test
